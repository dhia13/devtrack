name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "ruff>=0.6,<1"
      - run: ruff check app tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.12 is what the image runs; 3.13 catches breakage before the image moves to it.
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q --cov --cov-report=term --cov-fail-under=80

  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - run: python -m pytest -q -m e2e

  image:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v4
      - name: Build the container
        run: docker build -t devtrack:ci .
      - name: Start it and check health
        run: |
          docker run -d --name dt -p 127.0.0.1:8787:8787 -e DEVTRACK_GIT_SYNC_MINUTES=0 devtrack:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/api/health && curl -fs -o /dev/null http://127.0.0.1:8787/static/app.js && exit 0; sleep 1; done
          docker logs dt; exit 1
