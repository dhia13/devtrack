name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m pytest -q

  image:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the container
        run: docker build -t devtrack:ci .
      - name: Start it and check health
        run: |
          docker run -d --name dt -p 127.0.0.1:8787:8787 -e DEVTRACK_GIT_SYNC_MINUTES=0 devtrack:ci
          for i in $(seq 1 30); do curl -fs http://127.0.0.1:8787/api/health && exit 0; sleep 1; done
          docker logs dt; exit 1
